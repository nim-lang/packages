on: push

jobs:
  default:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no libpcre3-dev, which iffy/install-nim needs
    steps:
      - uses: actions/checkout@v7
      - uses: iffy/install-nim@v5.1.1
        with:
          version: stable
      - run: nim c -d:ssl -r -d:release package_scanner.nim packages.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
